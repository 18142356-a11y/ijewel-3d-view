<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Xem san pham 3D</title>
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0;
      overflow: hidden; background: #fff;
    }
    #viewer {
      display: block;
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%; height: 100%; height: 100dvh;
      border: 0; background: #fff;
      visibility: hidden;
    }
    #loading-cover {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: #fff;
      display: block;
      opacity: 1;
      pointer-events: auto;
    }
    #loading-cover.done { display: none; }
    #retry {
      display: none;
      position: absolute;
      left: 50%; bottom: max(8vh, 32px);
      transform: translateX(-50%);
      padding: 10px 16px;
      color: #555;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      font: 14px system-ui, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <iframe
    id="viewer"
    title="Xem san pham 3D"
    allow="autoplay; fullscreen; xr-spatial-tracking; web-share"
    allowfullscreen
    loading="eager"
  ></iframe>
  <div id="loading-cover" role="status" aria-label="Dang tai mo hinh 3D">
    <button id="retry" type="button">Thu tai lai san pham 3D</button>
  </div>
  <script>
  (() => {
    'use strict';
    const IJEWEL_URL = 'https://ijewel.design/embedded?isAutoplay=true&isPlayAnimations=false&isPlayCameraViews=false&isQuality=false&isRemoveLogo=true&isRemoveLogoLink=true&isShare=false&isTitle=false&isTurntableAnimation=true&slug=ebed292';

    // This is a cross-origin iframe. Its `load` event does not guarantee
    // the 3D model is fully rendered. A reliable scene-ready callback is not
    // exposed to this parent page. Therefore the delay is conservative.
    // Original version used 7 seconds; now add exactly 1.5 seconds.
    const HOLD_AFTER_IFRAME_LOAD_MS = 8500;
    const NO_LOAD_ERROR_MS = 45000;

    const frame = document.getElementById('viewer');
    const cover = document.getElementById('loading-cover');
    const retry = document.getElementById('retry');
    let loaded = false;
    let revealed = false;
    let holdTimer;
    let errorTimer;

    function reveal() {
      if (revealed || !loaded) return;
      revealed = true;
      clearTimeout(holdTimer);
      clearTimeout(errorTimer);
      // Show iframe and remove cover together in the next paint. No fade:
      // a partial-opacity transition could briefly expose the loading logo.
      requestAnimationFrame(() => {
        frame.style.visibility = 'visible';
        cover.classList.add('done');
      });
    }

    function load() {
      loaded = false;
      revealed = false;
      clearTimeout(holdTimer);
      clearTimeout(errorTimer);
      frame.style.visibility = 'hidden';
      cover.classList.remove('done');
      retry.style.display = 'none';
      frame.src = IJEWEL_URL;
      errorTimer = setTimeout(() => {
        if (!loaded) retry.style.display = 'block';
      }, NO_LOAD_ERROR_MS);
    }

    frame.addEventListener('load', () => {
      if (loaded || revealed) return;
      loaded = true;
      clearTimeout(errorTimer);
      // Intentionally ignore guessed postMessage "ready" events:
      // those could arrive before the branded loading view disappears.
      holdTimer = setTimeout(reveal, HOLD_AFTER_IFRAME_LOAD_MS);
    });
    retry.addEventListener('click', load);
    load();
  })();
  </script>
</body>
</html>
