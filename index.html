<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>3D Product Viewer</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    #product-viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #fff;
    }
    /* White cover sits ABOVE the embedded page, including the loading logo. */
    #white-cover {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
    }
    #white-cover.is-hidden { display: none; }
  </style>
</head>
<body>
  <iframe
    id="product-viewer"
    title="Xem san pham 3D"
    allow="autoplay; fullscreen; xr-spatial-tracking; web-share"
    allowfullscreen
    loading="eager"
  ></iframe>
  <div id="white-cover" role="status" aria-label="Dang tai mo hinh 3D"></div>

  <script>
    'use strict';
    const VIEWER_URL = 'https://ijewel.design/embedded?isAutoplay=true&isPlayAnimations=false&isPlayCameraViews=false&isQuality=false&isRemoveLogo=true&isRemoveLogoLink=true&isShare=false&isTitle=false&isTurntableAnimation=true&slug=ebed292';

    // FALLBACK_DELAY_MS applies AFTER the iframe load event.
    // Increase to 10000 if the loading logo still shows on a slower connection.
    // It is a fallback, NOT a guaranteed model-render-complete signal.
    const FALLBACK_DELAY_MS = 7000;

    const viewer = document.getElementById('product-viewer');
    const cover = document.getElementById('white-cover');
    const viewerOrigin = new URL(VIEWER_URL).origin;
    let revealed = false;
    let fallbackTimer;

    function showProduct() {
      if (revealed) return;
      revealed = true;
      clearTimeout(fallbackTimer);
      cover.classList.add('is-hidden');
      cover.setAttribute('aria-hidden', 'true');
    }

    // If the embedded provider exposes a real "scene loaded" postMessage,
    // reveal immediately. The normal iJewel Design iframe is NOT documented
    // to send these events to the parent, hence the timing fallback below.
    window.addEventListener('message', (event) => {
      if (event.source !== viewer.contentWindow || event.origin !== viewerOrigin) return;
      const data = event.data;
      const type = (typeof data === 'string') ? data :
        (data && typeof data === 'object' ? data.type || data.event : null);
      if (type === 'ijewel-scene-ready' ||
          type === 'scene_ready' ||
          type === 'loading_complete' ||
          type === 'model_loaded') {
        showProduct();
      }
    });

    // iframe.onload does NOT mean WebGL model has finished rendering.
    // Keep the pure-white cover for an additional conservative delay.
    viewer.addEventListener('load', () => {
      if (!revealed) fallbackTimer = setTimeout(showProduct, FALLBACK_DELAY_MS);
    });

    // Set src only after listeners have been attached.
    viewer.src = VIEWER_URL;
  </script>
</body>
</html>
